[alembic]
script_location = migrations
# Чтобы команда `alembic` находила пакет app при запуске из каталога backend.
prepend_sys_path = .
# Адрес базы берётся из DATABASE_URL (см. migrations/env.py).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
